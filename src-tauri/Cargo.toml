[package]
name = "warframe-companion"
version = "4.5.11"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "warframe_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt", "time", "net", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
memchr = "2"
ureq = { version = "2", features = ["json"] }
tungstenite = { version = "0.26", features = ["native-tls"] }
native-tls = "0.2"
whirlpool = "0.10"
lzma-rs = "0.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
# ── BEGIN ocrs fallback ─────────────────────────────────────────────────────
# Pure-Rust neural-net OCR; used when Windows.Media.Ocr has no language packs.
# To remove: delete ocr_fallback.rs, remove `mod ocr_fallback` from lib.rs,
# remove the fallback block in ocr.rs (search "BEGIN ocrs fallback"), and
# delete the four lines below.
ocrs = "0.7"
rten = "0.9"
# ── END ocrs fallback ───────────────────────────────────────────────────────

[package.metadata.cargo-machete]
# native-tls isn't imported directly — it's the backend enabled by
# tungstenite's "native-tls" feature (src/wfm.rs's client_tls call).
ignored = ["native-tls"]

[profile.dev]
opt-level = 1
incremental = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_Globalization",
] }
windows = { version = "0.58", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation_Collections",
    "Globalization",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
] }
